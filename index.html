<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />

    <!-- Google tag (gtag.js). Disclosed in section 4 of /privacy, as the Google
         Analytics terms require. Page changes between routes are counted by the
         property's "Page changes based on browser history events" setting. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W28E03R1YD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-W28E03R1YD');
    </script>

    <!-- Final mark: two interlocking arcs, accent green + ink. favicon.svg flips
         the ink arc to paper under prefers-color-scheme: dark. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Titles, descriptions, canonicals and social tags are per-page and come
         from src/components/Meta.jsx, so none of them are declared here. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
