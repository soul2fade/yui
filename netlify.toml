[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 requires Node ^20.19 || >=22.12; pin so the prerender build doesn't
  # fail on an older default Node in Netlify's image.
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# Diagnostic tools call /api/audit and /api/bottleneck.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Retired landing pages. Kept as 301s because the URLs may have been shared
# externally and should not dead-end.
[[redirects]]
  from = "/med-spas"
  to = "/"
  status = 301

[[redirects]]
  from = "/spa"
  to = "/"
  status = 301

# SPA fallback for client-side routes not prerendered at build time.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
